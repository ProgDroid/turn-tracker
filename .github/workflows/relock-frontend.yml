name: Relock frontend (Linux, one-shot)

# One-shot helper: regenerates frontend/package-lock.json on Linux, verifies it
# passes strict `npm ci` + build + test, and uploads it as an artifact. A human
# then downloads the artifact, commits it alongside the `npm install` -> `npm ci`
# switch, and deletes this workflow. Needed because the Windows-generated lockfile
# can't satisfy Linux `npm ci` and this dev machine can't produce a Linux lockfile
# (no WSL/Docker). The default GITHUB_TOKEN may not modify workflow files, so this
# only produces an artifact — it does not push. See memory: frontend-ci-lockfile.

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  relock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate lockfile on Linux
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Verify it passes strict npm ci + build + test
        working-directory: frontend
        run: |
          rm -rf node_modules
          npm ci
          npm run build
          npm run test
      - name: Upload the Linux lockfile
        uses: actions/upload-artifact@v4
        with:
          name: frontend-package-lock
          path: frontend/package-lock.json
          if-no-files-found: error
